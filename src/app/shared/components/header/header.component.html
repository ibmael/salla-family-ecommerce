<header class="sticky top-0 z-40 border-b border-black/10 bg-paper/90 backdrop-blur-md dark:border-white/10 dark:bg-ink/90">
  <div class="page flex h-16 items-center gap-4">
    <a routerLink="/" class="flex items-center gap-2" aria-label="Salla home">
      <img [src]="logo" alt="" class="h-8 w-8 rounded-full object-cover" />
      <img [src]="wordmark" alt="Salla" class="hidden h-6 w-auto sm:block" />
    </a>

    <form class="mx-auto hidden max-w-md flex-1 md:block" (submit)="$event.preventDefault(); search()">
      <label class="sr-only" for="header-search">Search products</label>
      <div class="relative">
        <lucide-icon [img]="icons.Search" class="absolute left-3 top-1/2 size-4 -translate-y-1/2 text-stone" />
        <input
          id="header-search"
          [(ngModel)]="query"
          name="q"
          type="search"
          placeholder="Search the collection..."
          class="w-full rounded-full border border-black/10 bg-white py-2.5 pl-10 pr-4 text-sm outline-none focus:border-clay dark:border-white/15 dark:bg-white/5"
        />
      </div>
    </form>

    <nav class="ml-auto flex items-center gap-1 sm:gap-2" aria-label="Main">
      <a routerLink="/category" class="hidden rounded-full px-3 py-2 text-sm font-medium hover:bg-black/5 dark:hover:bg-white/10 sm:inline-block">Shop</a>
      <a routerLink="/wishlist" class="relative rounded-full p-2 hover:bg-black/5 dark:hover:bg-white/10" aria-label="Wishlist">
        <lucide-icon [img]="icons.Heart" class="size-5" />
        @if (wishlist.count() > 0) {
          <span class="absolute -right-0.5 -top-0.5 grid size-4 place-items-center rounded-full bg-clay text-[10px] font-bold text-white">{{ wishlist.count() }}</span>
        }
      </a>
      <a routerLink="/cart" class="relative rounded-full p-2 hover:bg-black/5 dark:hover:bg-white/10" aria-label="Cart">
        <lucide-icon [img]="icons.ShoppingBag" class="size-5" />
        @if (cart.count() > 0) {
          <span class="absolute -right-0.5 -top-0.5 grid size-4 place-items-center rounded-full bg-clay text-[10px] font-bold text-white">{{ cart.count() }}</span>
        }
      </a>
      <button
        type="button"
        class="rounded-full p-2 hover:bg-black/5 dark:hover:bg-white/10"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        @if (theme.isDark()) {
          <lucide-icon [img]="icons.Sun" class="size-5" />
        } @else {
          <lucide-icon [img]="icons.Moon" class="size-5" />
        }
      </button>
      <a [routerLink]="auth.isLoggedIn() ? '/account' : '/auth'" class="rounded-full p-2 hover:bg-black/5 dark:hover:bg-white/10" aria-label="Account">
        <lucide-icon [img]="icons.User" class="size-5" />
      </a>
    </nav>
  </div>
</header>
