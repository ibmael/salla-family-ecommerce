<footer class="mt-20 border-t border-black/10 bg-sand dark:border-white/10 dark:bg-white/5">
  <div class="page grid gap-10 py-14 md:grid-cols-4">
    <div class="md:col-span-2">
      <div class="flex items-center gap-2.5">
        <img
          [src]="wordmark"
          alt="Salla"
          class="brand-wordmark h-7 sm:h-8 w-auto object-contain shrink-0"
        />
      </div>
      <p class="mt-3 max-w-sm text-sm leading-6 text-black/60 dark:text-white/60">
        A premium marketplace for considered living. Curated pieces, warm textures, timeless design.
      </p>
    </div>
    <div>
      <p class="eyebrow text-clay">Shop</p>
      <ul class="mt-4 space-y-2 text-sm">
        <li><a routerLink="/category" class="footer-link">All products</a></li>
        <li><a routerLink="/category/apparel" class="footer-link">Apparel</a></li>
        <li><a routerLink="/category/beauty" class="footer-link">Beauty</a></li>
        <li><a routerLink="/category/home" class="footer-link">Home</a></li>
        <li><a routerLink="/search" class="footer-link">Search</a></li>
      </ul>
    </div>
    <div>
      <p class="eyebrow text-clay">Account</p>
      <ul class="mt-4 space-y-2 text-sm">
        <li><a routerLink="/account" class="footer-link">Profile</a></li>
        <li><a routerLink="/orders" class="footer-link">Orders</a></li>
        <li><a routerLink="/wishlist" class="footer-link">Wishlist</a></li>
        <li><a routerLink="/cart" class="footer-link">Cart</a></li>
      </ul>
    </div>
  </div>
  <div
    class="border-t border-black/10 px-4 py-6 text-center text-xs text-black/50 dark:border-white/10 dark:text-white/50"
  >
    © 2026 Salla Studio. All rights reserved.
  </div>
</footer>
