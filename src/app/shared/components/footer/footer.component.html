<footer class="mt-20 border-t border-black/10 bg-sand dark:border-white/10 dark:bg-white/5">
  <div class="page grid gap-10 py-14 md:grid-cols-4">
    <div class="md:col-span-2">
      <div class="flex items-center gap-2.5">
        <img
          [src]="wordmark"
          alt="Salla"
          class="brand-wordmark h-7 sm:h-8 w-auto object-contain shrink-0"
        />
      </div>
      <p class="mt-3 max-w-sm text-sm leading-6 text-black/60 dark:text-white/60">
        A premium marketplace for considered living. Curated pieces, warm textures, timeless design.
      </p>
    </div>
    <div>
      <p class="eyebrow text-clay">Shop</p>
      <ul class="mt-4 space-y-2 text-sm">
        <li><a routerLink="/category" class="hover:underline">All products</a></li>
        <li><a routerLink="/category/apparel" class="hover:underline">Apparel</a></li>
        <li><a routerLink="/category/beauty" class="hover:underline">Beauty</a></li>
        <li><a routerLink="/category/home" class="hover:underline">Home</a></li>
        <li><a routerLink="/search" class="hover:underline">Search</a></li>
      </ul>
    </div>
    <div>
      <p class="eyebrow text-clay">Account</p>
      <ul class="mt-4 space-y-2 text-sm">
        <li><a routerLink="/account" class="hover:underline">Profile</a></li>
        <li><a routerLink="/orders" class="hover:underline">Orders</a></li>
        <li><a routerLink="/wishlist" class="hover:underline">Wishlist</a></li>
        <li><a routerLink="/cart" class="hover:underline">Cart</a></li>
      </ul>
    </div>
  </div>
  <div
    class="border-t border-black/10 px-4 py-6 text-center text-xs text-black/50 dark:border-white/10 dark:text-white/50"
  >
    © 2026 Salla Studio. All rights reserved.
  </div>
</footer>
