<a
  [routerLink]="['/product', product().slug]"
  class="group block"
>
  <div class="relative overflow-hidden rounded-card bg-sand dark:bg-white/10">
    <img
      [src]="product().image"
      [alt]="product().name"
      class="aspect-[4/5] w-full object-cover transition duration-500 group-hover:scale-105"
      loading="lazy"
    />
    @if (product().originalPrice) {
      <span class="absolute left-3 top-3 rounded-full bg-clay px-3 py-1 text-xs font-bold text-white">Sale</span>
    }
    @if (wishlist.count() >= 0) {
      <button
        type="button"
        class="absolute right-3 top-3 grid size-9 place-items-center rounded-full bg-white/90 text-lg backdrop-blur transition hover:scale-110 dark:bg-ink/80"
        [attr.aria-label]="wishlist.has(product().id) ? 'Remove from wishlist' : 'Add to wishlist'"
        [attr.aria-pressed]="wishlist.has(product().id)"
        (click)="toggleWishlist($event, product().id)"
      >
        {{ wishlist.has(product().id) ? '♥' : '♡' }}
      </button>
    }
  </div>
  <div class="mt-3">
    <p class="text-xs uppercase tracking-wider text-stone">{{ product().category }}</p>
    <h3 class="mt-1 font-display text-base font-semibold">{{ product().name }}</h3>
    <div class="mt-1 flex items-center gap-2">
      <span class="font-semibold">${{ product().price }}</span>
      @if (product().originalPrice) {
        <del class="text-sm text-black/40 dark:text-white/40">${{ product().originalPrice }}</del>
      }
    </div>
  </div>
</a>
