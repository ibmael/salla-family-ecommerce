<a
  [routerLink]="['/product', product().slug]"
  class="group block rounded-card focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay focus-visible:ring-offset-2"
>
  <div class="relative overflow-hidden rounded-card bg-sand dark:bg-white/10">
    <img
      [src]="product().image"
      [alt]="product().name"
      class="aspect-[4/5] w-full object-cover transition duration-300 group-hover:scale-105"
      loading="lazy"
    />
    @if (product().originalPrice) {
      <span class="absolute left-3 top-3 rounded-full bg-clay px-3 py-1 text-xs font-bold text-white shadow-sm select-none">Sale</span>
    }
    <!-- Card action buttons (top-right) - Wishlist only -->
    <div class="absolute right-3 top-3 z-10">
      <button
        type="button"
        class="grid size-9 place-items-center rounded-full bg-white/90 text-lg backdrop-blur transition duration-150 hover:scale-110 active:scale-90 dark:bg-ink/80 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay cursor-pointer shadow-sm"
        [attr.aria-label]="wishlist.has(product().id) ? 'Remove from wishlist' : 'Add to wishlist'"
        [attr.aria-pressed]="wishlist.has(product().id)"
        (click)="toggleWishlist($event, product().id)"
      >
        <span [class.text-clay]="wishlist.has(product().id)">
          {{ wishlist.has(product().id) ? '♥' : '♡' }}
        </span>
      </button>
    </div>
  </div>
  <div class="mt-3">
    <p class="text-xs uppercase tracking-wider text-stone">{{ product().category }}</p>
    <div class="mt-1 flex items-start justify-between gap-2.5">
      <h3 class="font-display text-base font-semibold text-ink dark:text-white leading-snug line-clamp-2 flex-1 min-w-0">
        {{ product().name }}
      </h3>
      <button
        type="button"
        class="grid size-8 shrink-0 place-items-center rounded-full transition duration-150 hover:scale-110 active:scale-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay cursor-pointer shadow-2xs"
        [class.bg-clay]="isInCart()"
        [class.text-white]="isInCart()"
        [class.bg-black/5]="!isInCart()"
        [class.dark:bg-white/10]="!isInCart()"
        [class.hover:bg-clay/15]="!isInCart()"
        [attr.aria-label]="isInCart() ? 'Remove from cart' : 'Add to cart'"
        [attr.title]="isInCart() ? 'Remove from cart' : 'Add to cart'"
        (click)="toggleCart($event)"
      >
        @if (isInCart()) {
          <lucide-icon [img]="icons.Check" class="size-4 text-white" />
        } @else {
          <lucide-icon [img]="icons.ShoppingBag" class="size-4 text-ink dark:text-paper" />
        }
      </button>
    </div>
    <div class="mt-1 flex items-center gap-2">
      <span class="font-semibold text-ink dark:text-white">${{ product().price }}</span>
      @if (product().originalPrice) {
        <del class="text-sm text-black/40 dark:text-white/40">${{ product().originalPrice }}</del>
      }
    </div>
  </div>
</a>
