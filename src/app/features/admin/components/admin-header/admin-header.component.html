<header class="admin-header-bar">
  <!-- Left Side: Mobile Menu Button & Breadcrumb -->
  <div class="flex items-center gap-3 sm:gap-4 min-w-0">
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="lg:hidden size-9 rounded-xl flex items-center justify-center hover:bg-black/5 dark:hover:bg-white/10 transition-colors cursor-pointer shrink-0"
      aria-label="Toggle navigation drawer"
    >
      <lucide-icon [img]="icons.Menu" class="size-5" aria-hidden="true" />
    </button>

    <div class="min-w-0 truncate">
      <div class="flex items-center gap-2 text-xs opacity-60">
        <span>Admin</span>
        <span>/</span>
        <span class="font-semibold opacity-100 truncate">{{ currentTitle() }}</span>
      </div>
    </div>
  </div>

  <!-- Right Side: [View store] [Theme] [Avatar] [Name + Role] (FAR RIGHT) -->
  <div class="flex items-center gap-2 sm:gap-3 shrink-0 ml-auto">
    <!-- View Storefront Link -->
    <a
      routerLink="/"
      class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border border-black/10 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10 transition-colors cursor-pointer"
      title="Open customer storefront"
    >
      <lucide-icon [img]="icons.Store" class="size-3.5 text-clay" aria-hidden="true" />
      <span>View store</span>
    </a>

    <!-- Theme Switcher Button -->
    <button
      type="button"
      (click)="theme.toggle()"
      class="theme-toggle-btn"
      [attr.aria-label]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [title]="theme.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
    >
      @if (theme.isDark()) {
        <lucide-icon [img]="icons.Sun" class="size-4 text-amber-400" aria-hidden="true" />
      } @else {
        <lucide-icon [img]="icons.Moon" class="size-4 text-stone" aria-hidden="true" />
      }
    </button>

    <!-- Admin Profile Pill: Fixed 40x40 Avatar + Name/Role -->
    <div class="flex items-center gap-2.5 pl-2 sm:pl-3 border-l border-black/10 dark:border-white/10 shrink-0">
      <div class="admin-avatar-box">
        @if (auth.user()?.avatar) {
          <img
            [src]="auth.user()?.avatar"
            [alt]="auth.user()?.name || 'Admin User'"
            loading="lazy"
          />
        } @else {
          <span>{{ userInitials() }}</span>
        }
      </div>

      <div class="hidden md:block text-left">
        <p class="text-xs font-semibold leading-tight">
          {{ auth.user()?.name || auth.user()?.username || 'Admin User' }}
        </p>
        <p class="text-[10px] opacity-60 font-medium leading-tight mt-0.5">
          {{ auth.user()?.role === 'admin' ? 'Administrator' : 'Store Manager' }}
        </p>
      </div>
    </div>
  </div>
</header>
