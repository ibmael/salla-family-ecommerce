<header class="admin-topbar h-16 bg-paper/80 dark:bg-ink/80 backdrop-blur-md border-b border-black/10 dark:border-white/10 px-4 sm:px-6 lg:px-8 flex items-center justify-between sticky top-0 z-30">
  <!-- Left Side: Mobile Menu Button & Breadcrumb -->
  <div class="flex items-center gap-3 sm:gap-4">
    <button
      type="button"
      (click)="toggleSidebar.emit()"
      class="lg:hidden size-10 rounded-xl flex items-center justify-center text-ink dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors cursor-pointer"
      aria-label="Toggle navigation drawer"
      aria-controls="admin-sidebar"
    >
      <lucide-icon [img]="icons.Menu" class="size-5" aria-hidden="true" />
    </button>

    <div>
      <div class="flex items-center gap-2 text-xs text-stone dark:text-white/50">
        <span>Admin</span>
        <span>/</span>
        <span class="text-ink dark:text-white font-medium">Dashboard</span>
      </div>
    </div>
  </div>

  <!-- Right Side: Store link, notification affordance, User Profile -->
  <div class="flex items-center gap-3 sm:gap-4">
    <a
      routerLink="/"
      class="hidden sm:inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold text-stone hover:text-ink dark:text-white/70 dark:hover:text-white border border-black/10 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10 transition-colors cursor-pointer"
      title="Open customer storefront"
    >
      <lucide-icon [img]="icons.Store" class="size-3.5 text-clay" aria-hidden="true" />
      <span>View storefront</span>
    </a>

    <!-- Notifications affordance -->
    <button
      type="button"
      class="size-9 rounded-full flex items-center justify-center text-stone hover:text-ink dark:text-white/70 dark:hover:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors relative cursor-pointer"
      aria-label="Notifications"
      title="Notifications"
    >
      <lucide-icon [img]="icons.Bell" class="size-4" aria-hidden="true" />
      <span class="absolute top-2 right-2 size-2 rounded-full bg-clay ring-2 ring-paper dark:ring-ink"></span>
    </button>

    <!-- User Profile Pill -->
    <div class="flex items-center gap-2.5 pl-2 sm:pl-3 border-l border-black/10 dark:border-white/10">
      <div class="size-8 rounded-full bg-[#4a5d4e] text-white flex items-center justify-center text-xs font-bold select-none shrink-0 shadow-sm">
        {{ userInitials() }}
      </div>
      <div class="hidden md:block text-left">
        <p class="text-xs font-semibold text-ink dark:text-white leading-tight">
          {{ auth.user()?.name || auth.user()?.username || 'Admin User' }}
        </p>
        <p class="text-[10px] text-stone dark:text-white/50 font-medium">
          {{ auth.user()?.role === 'admin' ? 'Administrator' : 'Store Manager' }}
        </p>
      </div>
    </div>
  </div>
</header>
