<div>
  <h1 class="font-display text-3xl font-semibold">Audit Logs</h1>
  <div class="mt-8 space-y-3">
    @for (log of logs(); track log.id) {
      <article class="log-card">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <p class="font-semibold">{{ log.action }}</p>
          <time class="text-xs opacity-60">{{ formatDate(log.timestamp, 'MMM d, yyyy HH:mm') }}</time>
        </div>
        <p class="mt-1 text-sm opacity-70">{{ log.actor }} → {{ log.target }}</p>
        <p class="mt-2 text-sm">{{ log.details }}</p>
      </article>
    }
  </div>
</div>
