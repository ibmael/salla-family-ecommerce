<div>
  <h1 class="font-display text-3xl font-semibold">Dashboard</h1>
  <p class="mt-2 text-black/60 dark:text-white/60">Overview of your store performance.</p>

  <div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div class="stat-card">
      <p class="text-sm opacity-60">Revenue</p>
      <p class="mt-2 font-display text-2xl font-bold">${{ stats().revenue }}</p>
    </div>
    <div class="stat-card">
      <p class="text-sm opacity-60">Orders</p>
      <p class="mt-2 font-display text-2xl font-bold">{{ stats().orders }}</p>
    </div>
    <div class="stat-card">
      <p class="text-sm opacity-60">Customers</p>
      <p class="mt-2 font-display text-2xl font-bold">{{ stats().customers }}</p>
    </div>
    <div class="stat-card">
      <p class="text-sm opacity-60">Products</p>
      <p class="mt-2 font-display text-2xl font-bold">{{ stats().products }}</p>
    </div>
  </div>
</div>
