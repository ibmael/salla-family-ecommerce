<div class="admin-app min-h-screen bg-sand/20 dark:bg-[#0e0c0a] text-ink dark:text-white flex">
  <!-- Desktop Persistent Sidebar (260px) -->
  <div class="hidden lg:block w-64 shrink-0 h-screen sticky top-0 z-40">
    <app-admin-sidebar />
  </div>

  <!-- Mobile Off-Canvas Drawer Backdrop -->
  @if (sidebarOpen()) {
    <div
      class="fixed inset-0 bg-black/50 backdrop-blur-xs z-40 lg:hidden transition-opacity"
      (click)="closeSidebar()"
      aria-hidden="true"
    ></div>
  }

  <!-- Mobile Off-Canvas Drawer (Slide-out) -->
  <div
    class="fixed inset-y-0 left-0 w-72 max-w-[85vw] z-50 lg:hidden transition-transform duration-300 ease-in-out shadow-2xl"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
    id="admin-sidebar"
    role="dialog"
    aria-modal="true"
    aria-label="Admin Navigation"
  >
    <app-admin-sidebar (closeDrawer)="closeSidebar()" />
  </div>

  <!-- Main Viewport Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <app-admin-header (toggleSidebar)="toggleSidebar()" />

    <!-- Main Content Container -->
    <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">
      <router-outlet />
    </main>
  </div>
</div>
