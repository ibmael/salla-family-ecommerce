<div>
  <h1 class="font-display text-3xl font-semibold">Customers</h1>
  <div class="mt-8 overflow-x-auto rounded-card bg-white dark:bg-white/5">
    <table class="w-full text-left text-sm">
      <thead>
        <tr class="border-b border-black/10 dark:border-white/10">
          <th class="p-4">Name</th>
          <th class="p-4">Email</th>
          <th class="p-4">Orders</th>
          <th class="p-4">Spent</th>
          <th class="p-4">Status</th>
        </tr>
      </thead>
      <tbody>
        @for (customer of customers(); track customer.id) {
          <tr class="border-b border-black/5 dark:border-white/5">
            <td class="p-4 font-medium">{{ customer.name }}</td>
            <td class="p-4">{{ customer.email }}</td>
            <td class="p-4">{{ customer.ordersCount }}</td>
            <td class="p-4">${{ customer.totalSpent }}</td>
            <td class="p-4 capitalize">{{ customer.status }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
