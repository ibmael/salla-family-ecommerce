<section class="page confirmation-page py-20 sm:py-28 text-center">
  <!-- Animated Success Icon -->
  <div class="success-icon-wrapper mx-auto">
    <div class="success-circle">
      <svg class="success-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    </div>
    <div class="success-ring"></div>
  </div>

  <!-- Content with staggered entrance -->
  <div class="confirm-heading">
    <p class="eyebrow mt-8 text-clay">Order confirmed</p>
    <h1 class="mt-3 font-display text-3xl sm:text-4xl font-semibold text-ink dark:text-white">
      Thank you for choosing&nbsp;well.
    </h1>
  </div>

  <div class="confirm-details">
    <p class="mt-4 text-sm sm:text-base text-stone dark:text-white/60 max-w-md mx-auto leading-relaxed">
      A confirmation has been sent to your inbox. Your order is being prepared with care.
    </p>
  </div>

  <div class="confirm-actions mt-10 flex flex-col sm:flex-row items-center justify-center gap-3">
    @if (orderId()) {
      <a
        [routerLink]="['/orders', orderId()]"
        class="inline-flex items-center gap-2 rounded-full border border-black/15 dark:border-white/20 px-6 py-3 text-sm font-bold text-ink dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors cursor-pointer"
      >
        <lucide-icon [img]="icons.Package" class="size-4 text-stone" />
        <span>View order</span>
      </a>
    } @else {
      <a
        routerLink="/orders"
        class="inline-flex items-center gap-2 rounded-full border border-black/15 dark:border-white/20 px-6 py-3 text-sm font-bold text-ink dark:text-white hover:bg-black/5 dark:hover:bg-white/10 transition-colors cursor-pointer"
      >
        <lucide-icon [img]="icons.Package" class="size-4 text-stone" />
        <span>View orders</span>
      </a>
    }
    <a
      routerLink="/category"
      class="btn-primary inline-flex items-center gap-2 px-6 py-3 text-sm font-bold cursor-pointer"
    >
      <span>Continue shopping</span>
      <lucide-icon [img]="icons.ArrowRight" class="size-4" />
    </a>
  </div>
</section>
