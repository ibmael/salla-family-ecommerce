<section class="page py-14">
  <h1 class="font-display text-4xl">{{ auth.user()?.name ?? 'Your account' }}</h1>
  <p class="mt-3 opacity-60">{{ auth.user()?.email ?? 'Sign in to view orders and preferences.' }}</p>
  <div class="mt-7 flex flex-wrap gap-3">
    <a routerLink="/orders" class="btn-secondary">Orders</a>
    <a routerLink="/wishlist" class="btn-secondary">Wishlist</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/admin" class="btn-secondary">Admin</a>
      <button type="button" class="btn-secondary" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/auth" class="btn-secondary">Sign in</a>
    }
  </div>
</section>
