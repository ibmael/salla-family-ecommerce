<section class="page py-14">
  <h1 class="font-display text-4xl font-semibold">Saved pieces</h1>
  <p class="mt-3 text-black/60 dark:text-white/60">Your shortlist stays here until you're ready.</p>

  @if (wishlist.count() > 0) {
    <div class="mt-8 grid grid-cols-2 gap-4 md:grid-cols-4">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  } @else {
    <div class="empty-state py-16 text-center max-w-md mx-auto">
      <p class="font-display text-2xl font-bold text-ink dark:text-white">Your wishlist is empty</p>
      <p class="text-sm text-stone dark:text-white/60 mt-2">Explore pieces and save your favorites for later.</p>
      <a routerLink="/category" class="btn-primary mt-6 inline-block">Browse collection</a>
    </div>
  }
</section>
