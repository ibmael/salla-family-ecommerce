<section class="page py-14">
  <h1 class="font-display text-4xl font-semibold">Saved pieces</h1>
  <p class="mt-3 text-black/60 dark:text-white/60">Your shortlist stays here until you're ready.</p>

  @if (wishlist.count() > 0) {
    <div class="mt-8 grid grid-cols-2 gap-4 md:grid-cols-4">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" />
      }
    </div>
  } @else {
    <a routerLink="/category" class="btn-primary mt-8 inline-block">Browse collection</a>
  }
</section>
