<section class="page py-8 sm:py-12">
  <app-breadcrumbs [items]="breadcrumbs" class="mb-4" />

  <div class="max-w-2xl">
    <p class="eyebrow text-clay">Curated Collections</p>
    <h1 class="font-display text-3xl sm:text-4xl lg:text-5xl font-semibold text-ink dark:text-white mt-1.5">
      Explore Categories
    </h1>
    <p class="mt-3 text-sm sm:text-base text-stone dark:text-white/60 leading-relaxed">
      Find something you'll love, from everyday essentials to pieces made for your space.
    </p>
  </div>

  <div class="mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    @for (cat of categories(); track cat.id) {
      <a
        [routerLink]="['/category', cat.slug]"
        class="category-discovery-card group relative flex flex-col rounded-2xl sm:rounded-3xl bg-white dark:bg-white/5 border border-black/10 dark:border-white/10 overflow-hidden transition-all duration-300 hover:shadow-lg hover:border-clay/40 dark:hover:border-clay/50 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-clay"
      >
        <!-- Category Image Container -->
        <div class="relative aspect-[4/3] sm:aspect-[5/4] w-full overflow-hidden bg-sand/30 dark:bg-white/5">
          <img
            [src]="cat.image"
            [alt]="cat.name"
            class="h-full w-full object-cover transition-transform duration-500 ease-out group-hover:scale-105"
            loading="lazy"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-transparent to-transparent opacity-60 group-hover:opacity-40 transition-opacity"></div>
          <span class="absolute top-3 right-3 rounded-full bg-white/90 dark:bg-ink/90 backdrop-blur-sm px-3 py-1 text-xs font-semibold text-ink dark:text-white shadow-sm">
            {{ cat.productCount }} pieces
          </span>
        </div>

        <!-- Card Body -->
        <div class="p-5 flex-1 flex flex-col justify-between">
          <div>
            <h2 class="font-display text-xl font-bold text-ink dark:text-white group-hover:text-clay transition-colors">
              {{ cat.name }}
            </h2>
            @if (cat.description) {
              <p class="mt-1.5 text-xs sm:text-sm text-stone dark:text-white/60 line-clamp-2 leading-relaxed">
                {{ cat.description }}
              </p>
            }
          </div>

          <!-- Bottom Action link -->
          <div class="mt-4 pt-4 border-t border-black/5 dark:border-white/10 flex items-center justify-between text-xs font-bold text-ink dark:text-white group-hover:text-clay transition-colors">
            <span>Explore collection</span>
            <lucide-icon [img]="icons.ArrowRight" class="size-4 transform group-hover:translate-x-1 transition-transform" />
          </div>
        </div>
      </a>
    }
  </div>
</section>
