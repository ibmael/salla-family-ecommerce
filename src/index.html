<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Salla — Premium Marketplace</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --splash-bg: #faf8f5;
        --splash-text: #17181c;
        --splash-stone: #8c887e;
        --splash-track: rgba(0, 0, 0, 0.07);
        --splash-clay: #ee4e24;
      }
      html.dark {
        --splash-bg: #111215;
        --splash-text: #f4f3f0;
        --splash-stone: #a6a39b;
        --splash-track: rgba(255, 255, 255, 0.08);
      }
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --splash-bg: #111215;
          --splash-text: #f4f3f0;
          --splash-stone: #a6a39b;
          --splash-track: rgba(255, 255, 255, 0.08);
        }
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--splash-bg);
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.35s ease;
        user-select: none;
        -webkit-user-select: none;
      }
      #app-splash.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 1.25rem;
      }
      .splash-logo-wrap {
        position: relative;
        width: 68px;
        height: 68px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-logo-img {
        width: 68px;
        height: 68px;
        object-fit: contain;
        display: block;
        animation: splashPulse 2s ease-in-out infinite alternate;
      }
      .splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.3rem;
      }
      .splash-title {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: 0.24em;
        color: var(--splash-text);
        text-indent: 0.24em;
      }
      .splash-sub {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: var(--splash-stone);
        text-indent: 0.18em;
        text-transform: uppercase;
      }
      .splash-progress-track {
        width: 96px;
        height: 3px;
        border-radius: 9999px;
        background-color: var(--splash-track);
        overflow: hidden;
        position: relative;
        margin-top: 0.25rem;
      }
      .splash-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 40%;
        background-color: var(--splash-clay);
        border-radius: 9999px;
        animation: splashIndeterminate 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes splashPulse {
        0% { transform: scale(0.97); opacity: 0.9; }
        100% { transform: scale(1.03); opacity: 1; }
      }
      @keyframes splashIndeterminate {
        0% { left: -45%; width: 35%; }
        50% { left: 35%; width: 50%; }
        100% { left: 105%; width: 35%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo-img,
        .splash-progress-bar {
          animation: none !important;
        }
        #app-splash {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="splash-inner">
        <div class="splash-logo-wrap">
          <img
            src="/assets/salla-logo.png"
            alt="Salla"
            class="splash-logo-img"
            width="68"
            height="68"
          />
        </div>
        <div class="splash-brand">
          <span class="splash-title">SALLA</span>
          <span class="splash-sub">PREMIUM MARKETPLACE</span>
        </div>
        <div class="splash-progress-track">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
    </div>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('salla-theme');
          var d = t === '"dark"' || t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (d) document.documentElement.classList.add('dark');
        } catch (e) {}
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var s = document.getElementById('app-splash');
            if (s && !s.classList.contains('fade-out')) {
              s.classList.add('fade-out');
              setTimeout(function() { if (s && s.parentNode) s.parentNode.removeChild(s); }, 360);
            }
          }, 3500);
        });
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
